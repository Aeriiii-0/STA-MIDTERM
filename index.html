<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA Practice Quiz | Final Exam</title>
    <style>
        :root {
            --bg-color: #0b1319;
            --card-bg: #13222d;
            --accent-teal: #00e5ff;
            --accent-green: #00e676;
            --text-main: #e0f2fe;
            --text-muted: #94a3b8;
            --border-color: #1e3a8a33;
            --option-bg: #1c2d3d;
            --option-hover: #263d52;
            --correct-bg: #064e3b;
            --correct-border: #10b981;
            --wrong-bg: #881337;
            --wrong-border: #f43f5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .quiz-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 800px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 229, 255, 0.1);
            border: 1px solid rgba(0, 229, 255, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header-bar {
            background-color: #0d1a24;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(0, 229, 255, 0.2);
        }

        .stats-left {
            display: flex;
            gap: 20px;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-teal);
        }

        .score-box {
            background: linear-gradient(135deg, rgba(0, 229, 255, 0.1), rgba(0, 230, 118, 0.1));
            border: 1px solid var(--accent-green);
            padding: 8px 16px;
            border-radius: 8px;
            text-align: right;
        }

        .score-box .stat-value {
            color: var(--accent-green);
        }

        .quiz-body {
            padding: 30px 24px;
        }

        .question-text {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 24px;
            font-weight: 600;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: var(--option-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            padding: 16px;
            border-radius: 10px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not([disabled]) {
            background-color: var(--option-hover);
            border-color: var(--accent-teal);
            transform: translateY(-2px);
        }

        .option-btn.correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: #ecfdf5;
        }

        .option-btn.wrong {
            background-color: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: #fff1f2;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.8;
        }

        .feedback-container {
            margin-top: 20px;
            min-height: 24px;
            font-weight: 600;
            font-size: 1.05rem;
        }

        .feedback-correct {
            color: var(--accent-green);
        }

        .feedback-wrong {
            color: #f43f5e;
        }

        .footer-bar {
            padding: 20px 24px;
            background-color: #0d1a24;
            display: flex;
            justify-content: flex-end;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .next-btn {
            background: linear-gradient(135deg, #00e5ff, #00e676);
            color: #0b1319;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .next-btn:hover:not(:disabled) {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .next-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: #334155;
            color: #94a3b8;
        }

        .completion-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .completion-screen h2 {
            font-size: 2rem;
            color: var(--accent-teal);
            margin-bottom: 12px;
        }

        .completion-screen p {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .restart-btn {
            background: linear-gradient(135deg, #00e5ff, #00e676);
            color: #0b1319;
            border: none;
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header-bar">
        <div class="stats-left">
            <div class="stat-box">
                <span class="stat-label">Total</span>
                <span class="stat-value" id="total-questions">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Answered</span>
                <span class="stat-value" id="answered-count">0</span>
            </div>
        </div>
        <div class="score-box">
            <span class="stat-label">Current Score</span>
            <div class="stat-value" id="score-display">0</div>
        </div>
    </div>

    <div class="quiz-body" id="quiz-body">
        <div class="question-text" id="question-text">Loading question...</div>
        <div class="options-grid" id="options-grid"></div>
        <div class="feedback-container" id="feedback"></div>
    </div>

    <div class="footer-bar" id="footer-bar">
        <button class="next-btn" id="next-btn" disabled>Next</button>
    </div>
</div>

<script>
const rawQuestions = [
    { q: "You are assigned to test a new mobile banking app. The project manager asks you to define the boundaries, deliverables, and criteria to guide the testing process. What core document component are you preparing?", options: ["Test Execution Script", "Test Scope", "Defect Log", "Code Review Checklist"], answer: 1 },
    { q: "A software team is developing a smartphone app and decides to exclude hardware-level testing because their sole focus is on application software. Under which section of the test scope does this decision belong?", options: ["Entry Criteria", "Inclusions and Exclusions", "Test Deliverables", "Test Environment"], answer: 1 },
    { q: "Before test execution can begin for a travel booking platform, the team requires a stable development build to be deployed to the staging environment. What does this requirement represent?", options: ["Exit Criteria", "Entry Criteria", "Acceptance Criteria", "Test Deliverable"], answer: 1 },
    { q: "The QA lead states that testing for a release will conclude once 95% test coverage is achieved and all critical bugs are resolved. What is this set of conditions called?", options: ["Entry Criteria", "Exit Criteria", "Priority 1 Objectives", "Test Scope Inclusions"], answer: 1 },
    { q: "A QA team produces a Test Plan, detailed Test Cases, and Bug Reports during their testing lifecycle. How are these items categorized within the test scope?", options: ["Test Deliverables", "Test Environment Parameters", "Boundary Conditions", "Terms of the Test"], answer: 0 },
    { q: "During a project meeting, your team discusses engaging developers, product managers, and business analysts to align testing efforts with overall business goals. Which step in defining test scope does this illustrate?", options: ["Step 1: Understand Project Objectives", "Step 3: Determine Test Types", "Step 6: Define Entry and Exit Criteria", "Step 8: Review and Validate"], answer: 0 },
    { q: "A software tester is asked to verify individual software functions, ensure security standards, evaluate performance, and check user-friendliness. Which step of defining test scope addresses selecting these methods?", options: ["Identify Critical Features", "Determine Test Types", "Specify Exclusions", "Document Deliverables"], answer: 1 },
    { q: "You are setting up tests to ensure that recent code modifications do not break existing software features. What type of testing are you planning?", options: ["Usability Testing", "Security Testing", "Performance Testing", "Regression Testing"], answer: 3 },
    { q: "To prevent misunderstandings between developers and testers regarding what will *not* be evaluated in the current release, which action must be taken?", options: ["Establishing Acceptance Criteria", "Specifying Inclusions and Exclusions", "Writing Automated Scripts", "Setting Up a Sandbox"], answer: 1 },
    { q: "After drafting the test scope document, the QA lead distributes it to project managers and developers to gather feedback and confirm agreement. What step is being performed?", options: ["Document Deliverables", "Review and Validate", "Establish Clear Objectives", "Transition to Automation"], answer: 1 },
    { q: "Midway through a project, the client adds a new payment gateway integration. The QA lead updates the test scope to incorporate this change. Why is this necessary?", options: ["Test scope is a static document that must be recreated from scratch", "Test scope is not static and must adapt as the project progresses", "Exit criteria automatically change when code changes", "Test case prioritization eliminates the need for scope reviews"], answer: 1 },
    { q: "When testing a financial application, your lead insists that testing occur strictly within an isolated sandbox environment to protect customer information. Under which test scope section is this documented?", options: ["Terms of the Test", "Bug Types", "Test Deliverables", "Resource Allocation"], answer: 0 },
    { q: "A test lead specifies that the web application must be tested across Chrome, Firefox, and Edge on Windows 10 and macOS. Where is this configuration detailed?", options: ["Test Environment", "Acceptance Criteria", "Test Instructions", "Inclusions and Exclusions"], answer: 0 },
    { q: "A requirement states: \"The document management system must handle uploaded files up to 100MB without performance degradation.\" What element of the test scope is this?", options: ["Acceptance Criteria", "Test Environment", "Attachment Specification", "Bug Type Definition"], answer: 0 },
    { q: "In a gaming application test plan, issues are categorized into game crashes, navigation glitches, and slow loading times. What section does this categorization represent?", options: ["Acceptance Criteria", "Bug Types", "Schedule and Timeline", "Prioritization Categories"], answer: 1 },
    { q: "A document contains step-by-step instructions: \"Step 1: Open item page. Step 2: Click 'Add to Cart'. Step 3: Verify item appears in cart.\" What section of the test scope does this describe?", options: ["Test Instructions", "Test Environment", "Terms of the Test", "Scope Exclusions"], answer: 0 },
    { q: "A tester attaches sample .png and .jpeg image files to the test scope for use in photo-editing test cases. What is this section called?", options: ["Test Resources", "Attachments", "Test Environment", "Test Deliverables"], answer: 1 },
    { q: "The management team sets User Acceptance Testing (UAT) to start on August 15th and run for exactly two weeks. Under which test scope section is this recorded?", options: ["Exit Criteria", "Schedule and Timeline", "Priority Matrix", "Terms of the Test"], answer: 1 },
    { q: "A QA manager lists physical iOS/Android devices and cloud-based device farms needed for location tracking tests. What section does this fulfill?", options: ["Test Environment", "Resources Required", "Inclusions and Exclusions", "Deliverables"], answer: 1 },
    { q: "A software test scope draft is submitted to the QA lead for initial review, followed by formal sign-off from the project manager. What process does this describe?", options: ["Review and Approval Process", "Exit Criteria Validation", "Traceability Matrix Audit", "Version-Specific Prioritization"], answer: 0 },
    { q: "When transitioning from manual test scope to test automation, which test cases should be prioritized for script creation?", options: ["Ad-hoc and single-use exploratory test cases", "Repetitive, critical, and regression-prone test cases", "Test cases with negligible business impact", "Documentation and scope review test cases"], answer: 1 },
    { q: "A team is evaluating an automation tool for a web portal. They analyze its ease of use, compatibility, and integration capabilities. Which step of automation transition are they performing?", options: ["Defining Exit Criteria", "Assessing Tool Suitability", "Writing Traceability Matrices", "Running General Test Prioritization"], answer: 1 },
    { q: "Why is Test Case Prioritization (TCP) critical in modern software development projects?", options: ["It guarantees that 100% of test cases are automated", "It eliminates the need to document software requirements", "Exhaustive testing of all scenarios is impractical due to resource limits", "It replaces the need for a test environment setup"], answer: 2 },
    { q: "A critical bug in the core payment processing module would cause severe business failure if released. Under standard prioritization rules, what priority is assigned to test cases covering this core feature?", options: ["Priority 4", "Priority 3", "Priority 2", "Priority 1"], answer: 3 },
    { q: "A tester has extra time before launch and decides to run optional validation tests that provide a helpful double-check, though failure would not disrupt main operations. How should these tests be categorized?", options: ["Priority 1", "Priority 2", "Priority 3", "Priority 4"], answer: 1 },
    { q: "Test cases for a minor UI cosmetic detail have negligible impact on application performance or business logic. Which priority level fits best?", options: ["Priority 1", "Priority 2", "Priority 3", "Priority 4"], answer: 3 },
    { q: "Test cases that are not urgent for the current software version release can be safely deferred to a minor patch release shortly after launch. Which priority level is appropriate?", options: ["Priority 1", "Priority 2", "Priority 3", "Priority 4"], answer: 2 },
    { q: "What primary guideline must be followed when establishing a test case prioritization scheme?", options: ["Lower-priority test cases must be automated first", "Lower-priority test cases must not cause severe impact on the software if skipped", "High-priority test cases should only focus on visual UI elements", "All test cases must be executed regardless of project schedules"], answer: 1 },
    { q: "A test suite is configured to run off-peak without requiring specific knowledge of changes in the new software build. It is intended to be reused across future versions. What type of prioritization is this?", options: ["Version-specific Test Case Prioritization", "General Test Case Prioritization", "Requirement Volatility Prioritization", "Cost-Aware Prioritization"], answer: 1 },
    { q: "Before running regression tests on version 2.4, the QA team prioritizes tests based specifically on the modified code files in version 2.4. What type of prioritization is this?", options: ["General Test Case Prioritization", "Version-specific Test Case Prioritization", "Static Scope Prioritization", "Acceptance Criteria Prioritization"], answer: 1 },
    { q: "A tester orders test cases based strictly on the total number of code lines executed by each test case. Which technique is being used?", options: ["Total Statement Coverage Prioritization", "Additional Statement Coverage Prioritization", "Fault Proneness Prioritization", "Requirement Complexity Prioritization"], answer: 0 },
    { q: "A QA engineer selects a test case with maximum code coverage, and then iteratively selects test cases that cover lines left uncovered by previous tests. What is this technique?", options: ["Total Branch Coverage Prioritization", "Additional Statement Coverage Prioritization", "Risk-based Prioritization", "History-based Prioritization"], answer: 1 },
    { q: "An automated suite selects test cases to ensure that every decision outcome (true/false branches) of an if-else block is executed. What technique is applied?", options: ["Total Statement Coverage Prioritization", "Total Branch Coverage Prioritization", "History-based Prioritization", "Cost-Aware Prioritization"], answer: 1 },
    { q: "What is the main objective of Risk-based Test Case Prioritization?", options: ["To minimize the dollar cost of buying testing tools", "To identify potential problem areas and test high-risk/high-consequence features first", "To maximize statement coverage regardless of feature importance", "To rely solely on customer-assigned priority numbers"], answer: 1 },
    { q: "During risk analysis, a testing team lists potential system failures, assigns a likelihood score to each, and calculates the impact severity. What is the next logical step in prioritizing these tests?", options: ["Test highest-risk problem areas first", "Exclude low-cost test cases", "Convert all manual scripts to automated scripts", "Ignore requirements with high volatility"], answer: 0 },
    { q: "A team prioritizes tests based on Customer Assigned Priority (CP), Requirement Volatility (RV), Implementation Complexity (IC), and Fault Proneness (FP). Which technique are they using?", options: ["Coverage-based TCP", "Requirements-based TCP", "History-based TCP", "Cost-Aware TCP"], answer: 1 },
    { q: "In Requirements-based TCP, a feature's requirements have been modified five times in two weeks. Which factor measures this instability?", options: ["Customer Assigned Priority (CP)", "Requirement Volatility (RV)", "Implementation Complexity (IC)", "Fault Proneness (FP)"], answer: 1 },
    { q: "When evaluating a requirement, the development team indicates that implementing a module requires complex architectural work and extensive effort. Which factor reflects this?", options: ["Requirement Implementation Complexity (IC)", "Fault Proneness (FP)", "Requirement Volatility (RV)", "Total Branch Coverage"], answer: 0 },
    { q: "Historical data shows that the payment module caused failures in 4 out of the last 5 release builds. Which requirements-based TCP factor tracks this trend?", options: ["Customer Assigned Priority (CP)", "Requirement Volatility (RV)", "Fault Proneness (FP)", "Additional Branch Coverage"], answer: 2 },
    { q: "A QA lead analyzes past execution logs to identify test cases with high failure rates in previous cycles and prioritizes them for execution today. What technique is being applied?", options: ["History-based TCP", "General TCP", "Total Statement Coverage TCP", "Schedule Allocation TCP"], answer: 0 },
    { q: "A testing team factors in the execution time, resource consumption, and setup cost of test cases, giving preference to lower-cost tests that yield quick feedback. What technique is this?", options: ["Risk-based TCP", "Cost-Aware based TCP", "Requirements-based TCP", "Branch Coverage TCP"], answer: 1 },
    { q: "What does a \"Test Schedule\" define in the context of the Software Development Life Cycle (SDLC)?", options: ["The list of automated tools to purchase", "A detailed plan outlining the sequence, start dates, and end dates of testing activities", "The bug severity rating assigned by end-users", "The matrix connecting software requirements to user stories"], answer: 1 },
    { q: "Why must a test schedule be strictly aligned with the overall project schedule?", options: ["To ensure testing does not cause overall project delays", "To force developers to finish code without unit testing", "To prevent the QA team from writing bug reports", "To reduce the requirement for hardware resources"], answer: 0 },
    { q: "A QA manager is allocating test engineers, automated tools, staging environments, and test data sets to upcoming test phases. What are these items collectively called?", options: ["Test Deliverables", "Test Resources", "Priority Categories", "Scope Boundaries"], answer: 1 },
    { q: "Which type of testing typically focuses on validating individual modules or components early in the development timeline?", options: ["User Acceptance Testing", "Unit Testing", "System Testing", "Regression Testing"], answer: 1 },
    { q: "How does effective management of test schedules and resources benefit a software project?", options: ["It eliminates the need to perform functional testing", "It identifies defects early, reducing costly post-release issues", "It guarantees that software requirements will never change", "It automates the generation of business requirements"], answer: 1 },
    { q: "A company plans to test a mobile app's performance under heavy traffic. They reserve 50 virtual machines and cloud load generators for 3 days. Where should this plan be documented?", options: ["Test Schedule and Resources", "Requirement Traceability Matrix", "Equivalence Class Partitioning", "Decision Table"], answer: 0 },
    { q: "In an Agile software environment, a feature's customer value is rated 10/10 by product owners. In Requirements-based TCP, how does this score impact the test case value?", options: ["It lowers the test case priority score", "It increases the test case priority value, scheduling it earlier", "It moves the test case to Priority 4", "It forces the test case to be executed manually"], answer: 1 },
    { q: "An automated regression suite detects bugs early in the build pipeline by executing high-risk tests first. What primary benefit of TCP is demonstrated?", options: ["Decreased overall code coverage", "Early fault detection and faster feedback", "Elimination of exit criteria", "Reduction of documentation requirements"], answer: 1 },
    { q: "What is the ultimate goal of defining a clear test scope, schedule, and priority scheme in software testing?", options: ["To deliver a high-quality, reliable software product aligned with business goals within resource limits", "To eliminate the need for QA managers and test documentation", "To ensure developers perform all testing activities without QA intervention", "To extend the SDLC timeline as long as possible"], answer: 0 },
    { q: "A tester uses formal techniques to design inputs and expected outcomes to achieve high coverage while using minimal resources. What are these methods called?", options: ["Scope Management", "Test Case Design Techniques", "Defect Management", "Project Scheduling"], answer: 1 },
    { q: "You are testing an input field that accepts user age from 0 to 120. Using Equivalence Class Partitioning, how should you structure the inputs?", options: ["Test every single integer from 0 to 120 individually", "Divide the input domain into sets of valid and invalid data groups treated similarly by the system", "Test only negative numbers", "Execute randomly generated floating-point numbers"], answer: 1 },
    { q: "An application processes age inputs with defined categories: Children (0-12), Teenagers (13-19), Adults (20-59), and Seniors (60-120). Which test case represents a valid equivalence partition test for Teenagers?", options: ["Age = 5", "Age = 15", "Age = 25", "Age = 65"], answer: 1 },
    { q: "Referring to the age categories above, what type of input is Age = -1 or Age = 20 (when evaluating the Teenager 13-19 partition)?", options: ["Valid boundary input", "Invalid input expecting error handling", "Acceptance criteria pass", "Total statement coverage metric"], answer: 1 },
    { q: "Software testing experience shows that errors occur more frequently at the extreme edges of input ranges rather than in the center. Which technique targets this issue?", options: ["Boundary Value Analysis (BVA)", "History-based Prioritization", "Reverse Traceability", "Ad-hoc Exploratory Testing"], answer: 0 },
    { q: "An e-commerce system allows customers to purchase between 1 and 10 items in a single transaction. What are the exact boundary values to test valid and invalid edges under BVA?", options: ["5, 6, 7", "0, 1, 10, 11", "-10, 50, 100", "2, 4, 8"], answer: 1 },
    { q: "If a text field accepts a password length of 8 to 16 characters, which set of character lengths represents Boundary Value Analysis testing?", options: ["1, 4, 12, 20", "7, 8, 16, 17", "9, 10, 11, 12", "0, 5, 15, 25"], answer: 1 },
    { q: "How does Boundary Value Analysis (BVA) relate to Equivalence Partitioning (EP)?", options: ["BVA completely replaces EP", "BVA complements EP by testing the edges of the established partitions", "BVA is used only for performance testing, while EP is for security", "BVA is used only when requirements are unknown"], answer: 1 },
    { q: "You are testing a discount module where eligibility depends on a combination of customer age and membership tier (Basic vs. Premium). Which test design technique is best suited here?", options: ["Boundary Value Analysis", "Equivalence Partitioning", "Decision Table Testing", "Statement Coverage Prioritization"], answer: 2 },
    { q: "What is another name for a Decision Table in software testing?", options: ["Cause-Effect Table", "Traceability Grid", "State Transition Diagram", "Code Coverage Matrix"], answer: 0 },
    { q: "A decision table rule states: Age < 18 (Any status) -> Discount = No. A tester inputs Age = 16 with a Basic membership and expects no discount. What does this test verify?", options: ["Boundary Value Analysis lower bound", "Specific rule combination in a Decision Table", "Reverse traceability link", "Statement coverage metric"], answer: 1 },
    { q: "What is the first step when creating a Decision Table for a complex feature?", options: ["List the test execution outcomes in the test log", "Identify functionalities where the output depends on a combination of inputs", "Purchase an automated test execution tool", "Calculate the implementation complexity score"], answer: 1 },
    { q: "What are artifacts created before or during testing to outline plans, test cases, and execution progress collectively called?", options: ["Test Scope Exclusions", "Test Documentation", "Source Code Repositories", "User Stories"], answer: 1 },

    { q: "A QA template contains fields such as Test ID, Test Description, Pre-Condition, Expected Result, Actual Result, Post-Condition, Pass/Fail, and Test Owner. What is this document?", options: ["Requirements Traceability Matrix", "Test Case Template", "Defect Severity Guide", "Bug Release Note"], answer: 1 },
    { q: "In a test case, the statement \"There should be an existing order in the cart\" represents which field?", options: ["Post-condition", "Pre-condition", "Actual Result", "Test Owner"], answer: 1 },

    { q: "What is the main purpose of a Requirement Traceability Matrix (RTM)?", options: ["To measure the execution speed of test scripts", "To map user requirements to test cases and ensure 100% test coverage", "To calculate developer salary based on fixed bugs", "To define hardware parameters for sandbox servers"], answer: 1 },
    { q: "A QA lead wants to confirm that every customer requirement provided in the functional design document has at least one corresponding test case. Which tool or document should they inspect?", options: ["Traceability Matrix", "Decision Table", "Statement Coverage Report", "Boundary Analysis Worksheet"], answer: 0 },
    { q: "An RTM links Requirement ID REQ_001 (Login Page) to Test Cases TC_01, TC_02, and TC_03. If TC_01 and TC_02 pass while TC_03 is not run, what is the coverage status for REQ_001?", options: ["Complete", "Partial", "Failed", "Deferred"], answer: 1 },

    { q: "A traceability matrix tracks requirements to test cases AND test cases back to requirements, helping analyze the impact of changes or defects in work products. What is this matrix called?", options: ["Unidirectional Traceability", "Bi-directional Traceability", "Horizontal Traceability", "Vertical Traceability"], answer: 1 },
    { q: "Which of the following is a primary business advantage of maintaining a Requirement Traceability Matrix (RTM)?", options: ["It confirms 100% test coverage and highlights missing requirements", "It automatically fixes syntax errors in source code", "It eliminates the need for test execution", "It guarantees that applications will load in under 1 second"], answer: 0 },
    { q: "What software application type provides a centralized repository for creating, managing, executing, and reporting on test cases throughout the SDLC?", options: ["Version Control System (e.g., Git)", "Test Case Management Tool", "Integrated Development Environment (IDE)", "Database Management System"], answer: 1 },
    { q: "A QA team uses a test management tool to ensure that when a test case is edited, older versions are preserved and changes are audited. Which feature does this describe?", options: ["Version Control", "Cost-aware Scheduling", "Boundary Analysis", "Forward Traceability"], answer: 0 },

let questions = [];
let currentIndex = 0;
let score = 0;
let answeredCount = 0;
let hasAnsweredCurrent = false;

function shuffleArray(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function initQuiz() {
    questions = shuffleArray(rawQuestions);
    currentIndex = 0;
    score = 0;
    answeredCount = 0;
    hasAnsweredCurrent = false;

    document.getElementById('total-questions').innerText = questions.length;
    document.getElementById('answered-count').innerText = answeredCount;
    document.getElementById('score-display').innerText = score;
    document.getElementById('footer-bar').style.display = 'flex';

    loadQuestion();
}

function loadQuestion() {
    hasAnsweredCurrent = false;
    document.getElementById('feedback').innerText = '';
    document.getElementById('next-btn').disabled = true;

    const currentQ = questions[currentIndex];
    document.getElementById('question-text').innerText = `${currentIndex + 1}. ${currentQ.q}`;

    const optionsGrid = document.getElementById('options-grid');
    optionsGrid.innerHTML = '';

    currentQ.options.forEach((optionText, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = optionText;
        btn.onclick = () => selectOption(idx);
        optionsGrid.appendChild(btn);
    });
}

function selectOption(selectedIdx) {
    if (hasAnsweredCurrent) return;
    hasAnsweredCurrent = true;

    const currentQ = questions[currentIndex];
    const optionsGrid = document.getElementById('options-grid');
    const buttons = optionsGrid.children;
    const feedback = document.getElementById('feedback');

    answeredCount++;
    document.getElementById('answered-count').innerText = answeredCount;

    if (selectedIdx === currentQ.answer) {
        score++;
        document.getElementById('score-display').innerText = score;
        buttons[selectedIdx].classList.add('correct');
        feedback.innerHTML = '<span class="feedback-correct">✓ Correct!</span>';
    } else {
        buttons[selectedIdx].classList.add('wrong');
        buttons[currentQ.answer].classList.add('correct');
        feedback.innerHTML = `<span class="feedback-wrong">✗ Incorrect. Correct answer: ${currentQ.options[currentQ.answer]}</span>`;
    }

    for (let btn of buttons) {
        btn.disabled = true;
    }

    document.getElementById('next-btn').disabled = false;
}

function nextQuestion() {
    if (!hasAnsweredCurrent) return;

    currentIndex++;
    if (currentIndex < questions.length) {
        loadQuestion();
    } else {
        showCompletionScreen();
    }
}

function showCompletionScreen() {
    const quizBody = document.getElementById('quiz-body');
    document.getElementById('footer-bar').style.display = 'none';

    const percentage = Math.round((score / questions.length) * 100);

    quizBody.innerHTML = `
        <div class="completion-screen">
            <h2>Quiz Completed!</h2>
            <p>You scored <strong>${score}</strong> out of <strong>${questions.length}</strong> (${percentage}%).</p>
            <button class="restart-btn" onclick="initQuiz()">Try Again (Reshuffle)</button>
        </div>
    `;
}

document.getElementById('next-btn').addEventListener('click', nextQuestion);

document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        if (hasAnsweredCurrent && currentIndex < questions.length) {
            nextQuestion();
        }
    }
});

// Start the quiz on load
initQuiz();
</script>

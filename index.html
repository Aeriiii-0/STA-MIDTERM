<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA Practice Quiz | Week 5 & 6</title>
    <style>
        :root {
            --bg-color: #0b1319;
            --card-bg: #13222d;
            --accent-teal: #00e5ff;
            --accent-green: #00e676;
            --text-main: #e0f2fe;
            --text-muted: #94a3b8;
            --border-color: #1e3a8a33;
            --option-bg: #1c2d3d;
            --option-hover: #263d52;
            --correct-bg: #064e3b;
            --correct-border: #10b981;
            --wrong-bg: #881337;
            --wrong-border: #f43f5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .quiz-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 800px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 229, 255, 0.1);
            border: 1px solid rgba(0, 229, 255, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header-bar {
            background-color: #0d1a24;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(0, 229, 255, 0.2);
        }

        .stats-left {
            display: flex;
            gap: 20px;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-teal);
        }

        .score-box {
            background: linear-gradient(135deg, rgba(0, 229, 255, 0.1), rgba(0, 230, 118, 0.1));
            border: 1px solid var(--accent-green);
            padding: 8px 16px;
            border-radius: 8px;
            text-align: right;
        }

        .score-box .stat-value {
            color: var(--accent-green);
        }

        .quiz-body {
            padding: 30px 24px;
        }

        .question-text {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 24px;
            font-weight: 600;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: var(--option-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            padding: 16px;
            border-radius: 10px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not([disabled]) {
            background-color: var(--option-hover);
            border-color: var(--accent-teal);
            transform: translateY(-2px);
        }

        .option-btn.correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: #ecfdf5;
        }

        .option-btn.wrong {
            background-color: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: #fff1f2;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.8;
        }

        .feedback-container {
            margin-top: 20px;
            min-height: 24px;
            font-weight: 600;
            font-size: 1.05rem;
        }

        .feedback-correct {
            color: var(--accent-green);
        }

        .feedback-wrong {
            color: #f43f5e;
        }

        .footer-bar {
            padding: 20px 24px;
            background-color: #0d1a24;
            display: flex;
            justify-content: flex-end;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .next-btn {
            background: linear-gradient(135deg, #00e5ff, #00e676);
            color: #0b1319;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .next-btn:hover:not(:disabled) {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .next-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: #334155;
            color: #94a3b8;
        }

        .completion-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .completion-screen h2 {
            font-size: 2rem;
            color: var(--accent-teal);
            margin-bottom: 12px;
        }

        .completion-screen p {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .restart-btn {
            background: linear-gradient(135deg, #00e5ff, #00e676);
            color: #0b1319;
            border: none;
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header-bar">
        <div class="stats-left">
            <div class="stat-box">
                <span class="stat-label">Total</span>
                <span class="stat-value" id="total-questions">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Answered</span>
                <span class="stat-value" id="answered-count">0</span>
            </div>
        </div>
        <div class="score-box">
            <span class="stat-label">Current Score</span>
            <div class="stat-value" id="score-display">0</div>
        </div>
    </div>

    <div class="quiz-body" id="quiz-body">
        <div class="question-text" id="question-text">Loading question...</div>
        <div class="options-grid" id="options-grid"></div>
        <div class="feedback-container" id="feedback"></div>
    </div>

    <div class="footer-bar" id="footer-bar">
        <button class="next-btn" id="next-btn" disabled>Next</button>
    </div>
</div>

<script>
const rawQuestions = [
    { q: "A newly hired QA Director needs to establish standard quality policies and general methodologies that will apply across all software products in the company for the next few years. Which document should they create?", options: ["Master Test Plan", "Iteration Test Plan", "Test Strategy Document", "Test Execution Report"], answer: 2 },
    { q: "A Senior Tester is drafting a document for an upcoming e-commerce release. They are writing detailed test cases, assigning individual testers to specific modules, and detailing exact test scripts. What is this document?", options: ["Test Strategy", "Test Plan", "Quality Policy", "Architecture Document"], answer: 1 },
    { q: "During an audit, an executive asks why the team has a Test Strategy document if they already have Test Plans for each sprint. Which response is most accurate?", options: ["The Test Strategy is updated every sprint, while Test Plans never change.", "The Test Strategy provides a stable, high-level perspective that all specific Test Plans must align with.", "Test Plans are for stakeholders, while the Test Strategy is strictly for junior testers.", "Test Plans are abstract, whereas the Test Strategy contains step-by-step test scripts."], answer: 1 },
    { q: "A company is transitioning from Waterfall to Agile. The QA Lead wants to update the overall approach, testing levels, and toolchain standard across all teams. Where should these modifications be documented first?", options: ["Sprint Backlog", "Test Strategy Document", "Defect Summary Report", "Test Case Management System"], answer: 1 },
    { q: "A project lead notices that different tester sub-teams are using conflicting approaches for regression testing across various sprints. What primary benefit of a Test Strategy was missing here?", options: ["Providing detailed step-by-step test instructions for each sprint", "Ensuring alignment on the overall vision and standardization across testing efforts", "Automatically generating automated test scripts", "Replacing the need for risk analysis"], answer: 1 },
    { q: "You are presenting the QA framework to project managers, business analysts, and development leads to seek approval on the overall testing approach for a new banking platform. Which document should you present?", options: ["Defect Log", "Test Strategy Document", "Test Execution Script", "Individual Sprint Plan"], answer: 1 },
    { q: "A software project is facing budget cuts midway through execution. The team needs to adjust high-level testing scope, tool selection, and deliverables without changing individual sprint schedules. Which document accommodates these macro changes best?", options: ["Test Strategy Document", "Test Script Matrix", "Bug Severity Index", "Test Execution Log"], answer: 0 },
    { q: "A tester needs to know the exact expected result for a specific boundary input on a login screen during Sprint 3. Where should they look?", options: ["Test Strategy Document", "Test Plan / Test Case Specification", "Company Quality Policy", "Test Environment Guide"], answer: 1 },
    { q: "While evaluating risk for a new medical application, a team finds a potential defect scenario: the probability of occurrence is low, but the potential impact on user safety is severe. How should the risk score be calculated according to standard test strategy practices?", options: ["Risk Score = Probability + Impact", "Risk Score = Probability × Impact", "Risk Score = Impact ÷ Probability", "Risk Score = Probability - Impact"], answer: 1 },
    { q: "A project team discovers that an automated test suite requires expensive commercial license renewals, but the budget cannot support it. Under which section of the Test Strategy should this issue and its contingency plan be categorized?", options: ["Testing Approach", "Testing Tools & Risks", "Test Deliverables", "Hardware-Software Configuration"], answer: 1 },
    { q: "A QA Manager wants to establish clear Key Performance Indicators (KPIs) to evaluate the efficiency and quality of the overall testing process across project releases. Which section of the Test Strategy covers this?", options: ["Scope & Objectives", "Testing Measurements & Metrics", "Test Deliverables", "Hardware Configuration"], answer: 1 },
    { q: "During the review of a fintech web application, the QA team needs to specify whether they will use physical servers or cloud-based virtual environments for multi-browser testing. Where in the Test Strategy document should this decision be recorded?", options: ["Test Deliverables", "Hardware-Software Configuration", "Testing Measurements", "Lifecycle of Tasks"], answer: 1 },
    { q: "A startup is building a web application and wants to ensure that all sprint releases undergo functional, usability, performance, and security testing. Where should these required testing categories be defined at a macro level?", options: ["Test Case Template", "Test Strategy Document (Testing Types)", "Defect Severity Guide", "Weekly Status Email"], answer: 1 },
    { q: "An auditor requests proof of all artifacts produced during a project's testing lifecycle (e.g., Test Summary Reports, Defect Reports, Test Logs). Which section of the Test Strategy outlines what artifacts the team must produce?", options: ["Test Deliverables", "Testing Approach", "Hardware Configuration", "Lifecycle of Tasks"], answer: 0 },
    { q: "A QA team lead is conducting a brainstorming session with the project manager, business analyst, and dev lead using a structured table of questions regarding sprint timelines, roles, tools, and reporting. What are they creating?", options: ["A Bug Report", "A Test Strategy Document", "A Unit Test Script", "A User Manual"], answer: 1 },
    { q: "A testing team is unable to run their test scripts because the database server, web server, and network settings are not properly configured to talk to each other. What is missing or improperly set up?", options: ["Test Bed / Test Environment", "Test Case Design", "Test Deliverables", "Defect Tracking Matrix"], answer: 0 },
    { q: "A team of developers and QA testers share the exact same staging database simultaneously. During test execution, automated test runs fail unexpectedly because developers are altering database schemas mid-test. What challenge does this represent?", options: ["Remote Environment Latency", "Shared Usage by Teams", "Lack of Test Data Tools", "Complex Code Architecture"], answer: 1 },
    { q: "A QA lead needs to configure an environment for a PHP-based web application requiring cron jobs and email server integration. Which step in the test environment setup process does this fall under?", options: ["Step 1: Setup of Test Server", "Step 2: Network Setup", "Step 3: Test PC Setup", "Step 4: Bug Reporting"], answer: 0 },
    { q: "Heavy performance test automation is causing severe network congestion, preventing graphic designers and content writers in the company office from accessing the internet. Which environment setup step was neglected?", options: ["Server Installation", "Network Setup / Isolation", "Test PC Configuration", "Test Data Anonymization"], answer: 1 },
    { q: "You are tasked with preparing test PCs for desktop software testing across Windows 10, Windows 11, macOS, and Linux. What step of the test environment setup process are you executing?", options: ["Setup of Test Server", "Test PC / Client Setup", "Bug Reporting Tool Setup", "Environment Management Maintenance"], answer: 1 },
    { q: "A financial enterprise wants to copy live production customer data into the test environment to replicate real-world scenarios. However, legal regulations require that all customer names, credit card numbers, and SSNs be replaced with realistic dummy values. What process must be performed?", options: ["Data Compression", "Data Obfuscation / Anonymization", "Data Normalization", "Data Migration Verification"], answer: 1 },
    { q: "A testing team decides to use a data masking strategy where ALL database fields copied from production are anonymized BY DEFAULT, except for a specific list of non-sensitive reference fields (e.g., Product Category, Branch ID). Which approach are they using?", options: ["BlackList Approach", "WhiteList Approach", "Greylist Approach", "Full Encryption Approach"], answer: 1 },
    { q: "A QA team uses an anonymization technique where all database fields copied from production remain exactly as they are in live production, EXCEPT for a specific list of fields marked by compliance officers (e.g., User Password, Credit Card Number). Which approach is this?", options: ["WhiteList Approach", "BlackList Approach", "Zero-Trust Approach", "Hybrid Masking Approach"], answer: 1 },
    { q: "The QA team is experiencing frequent environment downtime because multiple obsolete test environments are clogging server memory, and no central record exists for active setups. Which function is failing here?", options: ["Test Execution Automation", "Test Environment Management", "Test Case Prioritization", "User Acceptance Verification"], answer: 1 },
    { q: "Before starting test execution, a QA Lead goes through a list asking: \"Is required hardware available? Are needed software applications like Excel or Word specified? Is there a single point of contact for environment issues?\" What tool are they using?", options: ["Test Execution Matrix", "Test Environment Checklist", "Bug Severity Scale", "Traceability Matrix"], answer: 1 },
    { q: "A company's testing team is located in Manila, while the hardware test environment servers are physically housed in a data center in London. The Manila team frequently encounters delays waiting for physical hardware reboots. What challenge in Test Environment Management is this?", options: ["Shared Usage", "Remote Environment", "Elaborate Setup Time", "Lack of Test Data"], answer: 1 },
    { q: "A system administrator maintains a central repository containing updated versions of all test environments, monitors their health, and updates or deletes outdated environments upon request. What role/function is the admin performing?", options: ["Test Data Generation", "Test Environment Management", "Test Case Prioritization", "User Acceptance Testing"], answer: 1 },
    { q: "Why is it considered a best practice to check network connectivity, hardware/software licenses, and browser versions BEFORE initiating formal test execution?", options: ["To prevent test environment flaws from causing extra cost, lost time, and false defect reports", "To avoid having to write a Test Strategy Document", "To replace the need for test case design", "To eliminate the need for bug reporting tools"], answer: 0 },
    { q: "A developer sets up an isolated environment with a local web server, database, and test data specifically to test their own newly written modules without affecting live servers or main testing setups. What is this isolated environment called?", options: ["Test Bed / Isolated Test Setup", "Production Cluster", "Staging Pipeline", "Live Node"], answer: 0 },
    { q: "A tester needs to execute a query using SQL scripts directly against a copy of the database to extract a subset of customer accounts for an upcoming sprint. Why is this an effective test data approach?", options: ["It eliminates the need for database security", "It provides a smart, efficient way to source relevant data from large databases", "It bypasses the need for a test environment", "It guarantees 100% automated test execution"], answer: 1 },
    { q: "A tester is executing test cases for a bank account transfer feature. They enter negative amounts, letters in the account field, and extremely long numbers to evaluate how the system handles bad inputs. What type of testing are they performing?", options: ["Positive Testing", "Negative Testing", "Smoke Testing", "Structural Coverage Testing"], answer: 1 },
    { q: "A tester inputs valid credentials (a standard username and correct password) to ensure that a user can log in successfully as expected. What type of testing is this?", options: ["Negative Testing", "Positive Testing", "Stress Testing", "Boundary Exception Testing"], answer: 1 },
    { q: "Why is it strongly recommended to generate or prepare sample test data BEFORE beginning test execution rather than during test execution?", options: ["Generating data during execution takes time and can cause teams to exceed tight testing deadlines", "Creating test data after launch guarantees zero bugs", "Test data cannot be created once code is deployed", "Pre-creating test data eliminates the need for test environments"], answer: 0 },
    { q: "A developer examining source code creates test data specifically designed to force execution through every if-else branch and path within a function. What testing category does this test data preparation belong to?", options: ["Black Box Testing", "White Box Testing", "Usability Testing", "Acceptance Testing"], answer: 1 },
    { q: "An API tester prepares test data containing invalid parameter types and illegal argument combinations to call backend methods directly. What type of white box testing is being conducted?", options: ["Path Testing", "Negative API Testing", "Branch Coverage Testing", "Boundary Value Analysis"], answer: 1 },
    { q: "A QA engineer is preparing for a performance test on an e-commerce checkout page. What characteristic MUST their test dataset possess to ensure valid test results?", options: ["It must consist entirely of empty or null fields", "It must be very close to 'real' or live production data volumes and profiles", "It must contain only 5 test records to run quickly", "It must be generated without customer input or feedback"], answer: 1 },
    { q: "While designing test data for a medical application, a tester prepares datasets containing combinations of User Roles (Doctor, Nurse, Admin) paired with permitted/restricted system operations. Which security concept is this test data designed to verify?", options: ["Confidentiality", "Authorization", "Integrity", "Non-repudiation"], answer: 1 },
    { q: "A security tester creates a dataset of valid and invalid username/password pairs to verify that only registered users can log into a restricted portal. Which security aspect is being tested?", options: ["Confidentiality", "Authentication", "Integrity", "Scalability"], answer: 1 },
    { q: "A QA engineer tests an SSL-encrypted payment portal to ensure sensitive credit card details sent across the network cannot be read by unauthorized outside parties. Which security aspect does this test data evaluate?", options: ["Confidentiality", "Authorization", "Volatility", "Fault Proneness"], answer: 0 },
    { q: "A black box tester designs test datasets based on Boundary Value Analysis (e.g., testing age inputs at 17, 18, and 19 for an adult-only app). Which testing category are they preparing data for?", options: ["White Box Testing", "Black Box Testing", "Structural Code Testing", "Unit Component Testing"], answer: 1 },
    { q: "A QA tester leaves all text fields completely blank and submits an online loan application form to observe how the system responds. What black box test dataset criteria are they using?", options: ["Valid Data", "No Data", "Illegal Data Format", "Decision Table Dataset"], answer: 1 },
    { q: "A tester inputs an email address formatted as user#domain..com into a registration form to test input validation rules. What black box test data criteria does this represent?", options: ["Valid Data", "Illegal Data Format / Invalid Data", "Boundary Condition Data", "Equivalence Partition Data"], answer: 1 },
    { q: "A database administrator uses a tool called DTM Test Data Generator to automatically populate millions of synthetic rows into SQL database tables prior to stress testing. What is this tool an example of?", options: ["Manual Data Entry", "Automated Test Data Generation Tool", "Production Data Copying", "Static Code Analyzer"], answer: 1 },
    { q: "A testing team needs to quickly populate realistic flat ASCII files and directly feed test data into Oracle and SQL Server RDBMS platforms. Which automated tool mentioned in the reference material is designed for this?", options: ["Visual Studio Emulator", "Datatect", "Fedora Cron", "Jira"], answer: 1 },
    { q: "Why is poor test data design dangerous to software quality?", options: ["It consumes too little database storage space", "It may fail to test all possible test scenarios, allowing critical defects to leak into production", "It forces developers to write extra code", "It automatically cancels the test strategy document"], answer: 1 },
    { q: "A QA team is preparing to test a mobile banking application. The project lead writes a document stating: \"Testing will cover account transfers, balance inquiries, and bill payments, but will EXCLUDE hardware durability testing of the physical phone.\" What concept is being defined?", options: ["Defect Density", "Test Scope", "Test Case Prioritization", "Code Coverage Metric"], answer: 1 },
    { q: "Imagine you are building a new smartphone. You list all features to test (camera, touchscreen, pre-installed apps) and specify that software usability is IN-SCOPE while battery hardware stress testing is OUT-OF-SCOPE. What does this clarity prevent?", options: ["Misunderstandings regarding testing boundaries and responsibilities", "Writing test cases", "Bugs in the software", "Resource allocation"], answer: 0 },
    { q: "A QA lead establishes that formal test execution for a new sprint CANNOT begin until the development team delivers a stable build and the staging server is fully configured. What has been defined?", options: ["Exit Criteria", "Entry Criteria", "Acceptance Criteria", "Test Case Prioritization"], answer: 1 },
    { q: "A project manager states: \"Testing for Sprint 4 will conclude when 100% of P1 test cases pass and all critical defects are resolved.\" What is this rule called?", options: ["Entry Criteria", "Exit Criteria", "Test Scope Inclusions", "Resource Schedule"], answer: 1 },
    { q: "You are drafting a test scope document for a healthcare web app. You include a rule: \"Testing will be conducted strictly in a isolated sandbox environment to prevent real patient records from being altered.\" What section of the test scope contains this rule?", options: ["Acceptance Criteria", "Terms of the Test", "Resource Allocation", "Attachments"], answer: 1 },
    { q: "A QA team specifies that a document management platform MUST process and upload PDF files up to 100MB within 3 seconds without system degradation. Under which test scope element does this requirement belong?", options: ["Terms of the Test", "Acceptance Criteria", "Test Deliverables", "Test Environment Setup"], answer: 1 },
    { q: "While creating a test scope for a travel booking site, the tester attaches sample .jpg passport images and .csv mock passenger files to be uploaded during test case execution. Which test scope element is this?", options: ["Terms of the Test", "Attachments", "Acceptance Criteria", "Exit Criteria"], answer: 1 },
    { q: "A QA Manager writes step-by-step guidance on how to navigate to a product page, click 'Add to Cart', and verify cart updating. What is this element in the test scope?", options: ["Test Scope Inclusions", "Test Instructions", "Entry Criteria", "Terms of the Test"], answer: 1 },
    { q: "A team is testing a gaming application and explicitly categorizes potential defects into Functionality Crashes, Usability Glitches, and Performance Bottlenecks. What section of the test scope is this?", options: ["Bug Types", "Test Environment", "Acceptance Criteria", "Exit Criteria"], answer: 0 },
    { q: "During Step 1 of defining a test scope for a project, what should a QA lead do first?", options: ["Write automated scripts immediately", "Engage with stakeholders (developers, product managers, business analysts) to understand project objectives", "Purchase performance testing licenses", "Log defects in Jira"], answer: 1 },
    { q: "A QA engineer creates a draft of the Test Scope document. Who should review and validate this document before testing begins?", options: ["Only external customers", "Relevant stakeholders, including project managers, developers, and the QA team", "Junior testers only", "The hardware vendor"], answer: 1 },
    { q: "Midway through a software project, the client adds a new multi-currency payment feature. What should happen to the Test Scope document?", options: ["It should remain unchanged because test scopes are permanently static", "It should be updated and re-communicated to align with changing project goals", "It should be deleted and replaced with a test script", "Testing should be skipped for the new feature"], answer: 1 },
    { q: "A testing team is transitioning from manual testing to automation. They select repetitive, critical, and regression-prone user flows from their test scope (e.g., user login, flight search). What step are they performing?", options: ["Assessing Automation Potential / Selecting Test Cases for Automation", "Defining Entry Criteria", "Writing Bug Reports", "Conducting Usability Audits"], answer: 0 },
    { q: "After executing automated scripts generated from the test scope, a tester gathers test logs, identifies script failures, and reports bugs to developers. What step in the scope-to-automation transition is this?", options: ["Select Test Cases for Automation", "Analyze Results, Report Defects, and Refine Automation", "Evaluate Tool Suitability", "Define Terms of the Test"], answer: 1 },
    { q: "Which of the following is a tangible output/deliverable resulting from software testing efforts as outlined in a test scope?", options: ["Test Plan, Test Cases, Defect Reports, Test Summary Reports", "Application Source Code, Compiler Logs, Database Schemas", "Business Financial Audits, Sales Invoices", "User Hardware Specs, Ethernet Cables"], answer: 0 },
    { q: "A software application has grown so large that executing the entire test suite takes 48 hours. Due to tight release deadlines, the QA team only has 8 hours for regression testing. What technique must they apply?", options: ["Test Data Anonymization", "Test Case Prioritization (TCP)", "WhiteList Data Masking", "Environment Virtualization"], answer: 1 },
    { q: "What is the primary purpose of Test Case Prioritization (TCP)?", options: ["To eliminate the need for writing test scripts", "To order test cases so that high-priority/critical tests run first, revealing faults earlier", "To prevent developers from modifying source code", "To convert all manual tests into unit tests"], answer: 1 },
    { q: "A QA team classifies a test case as Priority 1 (P1). What does this designation mean?", options: ["The test case is optional and can be run after release if time permits", "The test case MUST be executed because failure severely disrupts core system functionality", "The test case has negligible impact on software operation", "The test case is intended for post-release regression only"], answer: 1 },
    { q: "A tester is assigned a test case that checks whether the footer copyright year on a web page is correct. If it fails, user experience is unaffected. Which priority level should this test case be assigned?", options: ["Priority 1 (P1)", "Priority 2 (P2)", "Priority 4 (P4) / Low Priority", "Critical Blocking Priority"], answer: 2 },
    { q: "A test case validates a secondary reporting feature. It is valuable to test, but if time runs out before launch, the release can still proceed safely and the test can be run shortly after release. What priority is this?", options: ["Priority 1 (P1)", "Priority 3 (P3)", "Priority 0 (P0)", "Blocker"], answer: 1 },
    { q: "A company maintains a general test suite for a core software product. They want to order the test cases during off-peak hours so that the prioritized sequence remains useful across multiple upcoming releases without knowing specific code changes in advance. What type of TCP is this?", options: ["Version-Specific Test Case Prioritization", "General Test Case Prioritization", "Cost-Aware Prioritization", "Risk-based Prioritization"], answer: 1 },
    { q: "In preparation for a patch release (Version 2.1.4), developers inform QA that changes were made exclusively to the payment gateway module. The QA team prioritizes test cases specifically targeting the modified payment code. What type of TCP is this?", options: ["General Test Case Prioritization", "Version-Specific Test Case Prioritization", "History-based Prioritization", "Random Prioritization"], answer: 1 },
    { q: "Why is exhaustive testing (running every possible test case scenario) usually impractical or impossible for complex commercial software?", options: ["Software code changes too quickly", "It requires prohibitive amounts of time, cost, and effort", "Testing tools do not support large test cases", "Exhaustive testing corrupts databases"], answer: 1 },
    { q: "How does effective test case prioritization impact the Software Development Life Cycle (SDLC)?", options: ["It guarantees that software will never have minor bugs", "It helps meet project milestones, detects high-risk bugs earlier, and reduces regression testing costs", "It eliminates the need for test environments", "It replaces the business requirements document"], answer: 1 },
    { q: "What is a key guideline that QA leads must follow when assigning test case priorities?", options: ["All test cases must be labeled as Priority 1", "Lower priority test cases should not cause severe business impact if they fail or are delayed", "Developers should decide all priorities without QA involvement", "Priorities should change randomly during test execution"], answer: 1 },
    { q: "A QA team uses a code coverage tool. They rank Test Case A higher than Test Case B because Test Case A executes 15 lines of code, while Test Case B executes only 3 lines. Which TCP technique are they using?", options: ["Total Statement Coverage Prioritization", "Risk-based TCP", "History-based TCP", "Requirements-based TCP"], answer: 0 },
    { q: "A tester selects Test Case 1 because it covers the maximum number of code statements. Next, instead of picking another high-coverage test that hits the exact same code, they select Test Case 2 because it covers statements that were LEFT UNCOVERED by Test Case 1. What technique is this?", options: ["Total Branch Coverage Prioritization", "Additional Statement Coverage Prioritization", "Cost-Aware TCP", "History-based TCP"], answer: 1 },

let questions = [];
let currentIndex = 0;
let score = 0;
let answeredCount = 0;
let hasAnsweredCurrent = false;

function shuffleArray(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function initQuiz() {
    questions = shuffleArray(rawQuestions);
    currentIndex = 0;
    score = 0;
    answeredCount = 0;
    hasAnsweredCurrent = false;

    document.getElementById('total-questions').innerText = questions.length;
    document.getElementById('answered-count').innerText = answeredCount;
    document.getElementById('score-display').innerText = score;
    document.getElementById('footer-bar').style.display = 'flex';

    loadQuestion();
}

function loadQuestion() {
    hasAnsweredCurrent = false;
    document.getElementById('feedback').innerText = '';
    document.getElementById('next-btn').disabled = true;

    const currentQ = questions[currentIndex];
    document.getElementById('question-text').innerText = `${currentIndex + 1}. ${currentQ.q}`;

    const optionsGrid = document.getElementById('options-grid');
    optionsGrid.innerHTML = '';

    currentQ.options.forEach((optionText, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = optionText;
        btn.onclick = () => selectOption(idx);
        optionsGrid.appendChild(btn);
    });
}

function selectOption(selectedIdx) {
    if (hasAnsweredCurrent) return;
    hasAnsweredCurrent = true;

    const currentQ = questions[currentIndex];
    const optionsGrid = document.getElementById('options-grid');
    const buttons = optionsGrid.children;
    const feedback = document.getElementById('feedback');

    answeredCount++;
    document.getElementById('answered-count').innerText = answeredCount;

    if (selectedIdx === currentQ.answer) {
        score++;
        document.getElementById('score-display').innerText = score;
        buttons[selectedIdx].classList.add('correct');
        feedback.innerHTML = '<span class="feedback-correct">✓ Correct!</span>';
    } else {
        buttons[selectedIdx].classList.add('wrong');
        buttons[currentQ.answer].classList.add('correct');
        feedback.innerHTML = `<span class="feedback-wrong">✗ Incorrect. Correct answer: ${currentQ.options[currentQ.answer]}</span>`;
    }

    for (let btn of buttons) {
        btn.disabled = true;
    }

    document.getElementById('next-btn').disabled = false;
}

function nextQuestion() {
    if (!hasAnsweredCurrent) return;

    currentIndex++;
    if (currentIndex < questions.length) {
        loadQuestion();
    } else {
        showCompletionScreen();
    }
}

function showCompletionScreen() {
    const quizBody = document.getElementById('quiz-body');
    document.getElementById('footer-bar').style.display = 'none';

    const percentage = Math.round((score / questions.length) * 100);

    quizBody.innerHTML = `
        <div class="completion-screen">
            <h2>Quiz Completed!</h2>
            <p>You scored <strong>${score}</strong> out of <strong>${questions.length}</strong> (${percentage}%).</p>
            <button class="restart-btn" onclick="initQuiz()">Try Again (Reshuffle)</button>
        </div>
    `;
}

document.getElementById('next-btn').addEventListener('click', nextQuestion);

document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        if (hasAnsweredCurrent && currentIndex < questions.length) {
            nextQuestion();
        }
    }
});

// Start the quiz on load
initQuiz();
</script>
